# Mirrors the Plug skill from Plug's connector, its one source, into skills/plug/SKILL.md.
# The file is edited in pluuug-net/plug-ai (mcp_server/skill/SKILL.md), tested there, and
# served at https://mcp.plug.inc/skill.md once deployed. Never edit the copy in this repo.
name: Sync the Plug skill

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the deployed skill
        run: |
          curl -fsSL https://mcp.plug.inc/skill.md -o /tmp/SKILL.md
          head -3 /tmp/SKILL.md | grep -qx "name: plug" || { echo "Not the Plug skill, stopping"; exit 1; }
          cp /tmp/SKILL.md skills/plug/SKILL.md
      - name: Commit if it changed
        run: |
          git diff --quiet && { echo "Already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync the Plug skill from mcp.plug.inc"
          git push
